<style>
  :root {
    --bg: #000000;
    --ink: #EDEBE6;
    --muted: #8C8A85;
    --line: #262626;
    --gold: #CFB87C;      /* UCCS gold */
    --slide-w: min(62vw, 760px);
    --gap: 28px;
    --font: "Archivo", "Helvetica Neue", Arial, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 17px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 4px; }

  .page {
    min-height: 100%;
    display: grid;
    grid-template-rows: auto 1fr auto;
    grid-template-columns: minmax(0, 1fr);
    max-width: 1400px;
    margin: 0 auto;
    padding: 28px clamp(16px, 4vw, 48px) 24px;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
  }
  .name {
    margin: 0;
    font-size: clamp(28px, 4.2vw, 52px);
    font-weight: 850;
    font-stretch: 125%;
    letter-spacing: -0.01em;
    line-height: 0.95;
  }
  .name small {
    display: block;
    margin-top: 10px;
    font-size: 15px;
    font-weight: 400;
    font-stretch: 100%;
    letter-spacing: 0;
    line-height: 1.4;
    color: var(--muted);
  }
  .contact {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
    font-size: 15px;
    padding-top: 6px;
  }
  .contact a { text-decoration: none; color: var(--ink); }
  .contact a:hover { color: var(--gold); }
  .contact .short { display: none; }

  /* ---------- Section tabs ---------- */
  main { min-width: 0; display: flex; flex-direction: column; justify-content: center; padding: 30px 0 12px; }
  .tabs {
    display: flex;
    justify-content: center;
    gap: 6px 22px;
    flex-wrap: wrap;
    margin: 0 0 22px;
    padding: 0;
    list-style: none;
  }
  .tabs button {
    background: none; border: 0; padding: 6px 0;
    font: inherit; font-size: 15px; color: var(--muted);
    border-bottom: 2px solid transparent;
    cursor: pointer; white-space: nowrap;
  }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-current="true"] { color: var(--ink); border-bottom-color: var(--gold); }

  /* ---------- Carousel ---------- */
  .stage {
    position: relative;
    width: 100vw;
    margin-left: calc(50% - 50vw);
    height: calc(var(--slide-w) * 0.625);
    overflow: hidden;
    touch-action: pan-y;
    user-select: none;
  }
  .slide {
    position: absolute;
    top: 0;
    left: 50%;
    width: var(--slide-w);
    height: 100%;
    margin-left: calc(var(--slide-w) / -2);
    border-radius: 10px;
    overflow: hidden;
    background: #151515;
    transition: transform .55s cubic-bezier(.2,.8,.2,1), opacity .55s ease, filter .55s ease;
    cursor: pointer;
  }
  .slide.is-current { cursor: default; box-shadow: 0 0 0 1px var(--line); }
  .slide img, .slide video { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  /* fit: "contain" shows the whole photo over a dimmed, blurred copy of itself */
  .slide .fill { position: absolute; inset: -20px; width: calc(100% + 40px); height: calc(100% + 40px); filter: blur(18px) brightness(.45); }
  .slide .whole { position: relative; object-fit: contain; }

  /* placeholder art when no photo/video yet */
  .ph {
    width: 100%; height: 100%;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: clamp(16px, 3vw, 36px);
    background:
      repeating-linear-gradient(90deg, transparent 0 calc(12.5% - 1px), rgba(255,255,255,.05) calc(12.5% - 1px) 12.5%),
      radial-gradient(120% 90% at 85% 10%, var(--tint) 0%, #0d0d0d 70%);
  }
  .ph i { font-style: normal; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.6); margin-bottom: 8px; }
  .ph b {
    font-size: clamp(34px, 7vw, 96px);
    font-weight: 900;
    font-stretch: 62%;
    line-height: .85;
    text-transform: uppercase;
    color: rgba(255,255,255,.9);
  }

  .arrow {
    position: absolute;
    top: 50%;
    z-index: 5;
    width: 48px; height: 72px;
    transform: translateY(-50%);
    display: grid; place-items: center;
    background: rgba(0,0,0,.72);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
    cursor: pointer;
    transition: border-color .2s, color .2s;
  }
  .arrow:hover { border-color: var(--gold); color: var(--gold); }
  .arrow svg { width: 22px; height: 22px; }
  .arrow.prev { left: calc(50% - var(--slide-w) / 2 - 24px); }
  .arrow.next { right: calc(50% - var(--slide-w) / 2 - 24px); }

  /* ---------- Description ---------- */
  .desc {
    width: var(--slide-w);
    max-width: 100%;
    margin: 26px auto 0;
    min-height: 170px;
  }
  .desc-top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .desc h2 {
    margin: 0;
    font-size: clamp(22px, 2.6vw, 32px);
    font-weight: 800;
    font-stretch: 112%;
    line-height: 1.1;
  }
  .count { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .role { margin: 6px 0 10px; color: var(--gold); font-size: 15px; }
  .desc p.body { margin: 0 0 8px; max-width: 64ch; color: #CFCCC6; }

  .desc li { margin: 0 0 6px; }

  .desc .more { display: inline-block; margin-top: 6px; font-size: 15px; color: var(--gold); text-underline-offset: 4px; overflow-wrap: anywhere; }
  .desc.swap > * { animation: fade .35s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* ---------- Footer ---------- */
  footer {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 16px;
    margin-top: 12px;
    padding-top: 22px;

  .resume {

    font-weight: 700;
    font-stretch: 110%;

    border-radius: 6px;

  .resume:hover { background: var(--ink); }
  .download { font-size: 14px; color: var(--muted); text-underline-offset: 3px; }
  .download:hover { color: var(--gold); }
  .social { justify-self: end; display: flex; gap: 20px; }
  .social a { display: inline-flex; align-items: center; gap: 8px; }
  .social svg { width: 18px; height: 18px; }

  /* ---------- Future projects sheet ---------- */
  dialog {
    width: min(560px, calc(100vw - 32px));
    max-height: 80vh;
    padding: 28px;
    background: #0e0e0e;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 12px;

  dialog::backdrop { background: rgba(0,0,0,.75); }
  dialog h3 { margin: 0 0 4px; font-size: 24px; font-weight: 800; font-stretch: 112%; }
  dialog .sub { margin: 0 0 18px; color: var(--muted); font-size: 15px; }
  dialog ul { list-style: none; margin: 0; padding: 0; }
  dialog li { padding: 14px 0; border-top: 1px solid var(--line); }
  dialog li b { display: block; font-weight: 700; }
  dialog li span { color: #BDBAB4; font-size: 15px; }
  dialog .close { margin-top: 18px; }

  /* ---------- Desktop: only the tip of the footer peeks in at the bottom ----------
     JS sets --peek-hide to how much of the footer sits below the screen edge. */
  @media (min-width: 721px) {
    footer {
      position: sticky;
      bottom: calc(-1 * var(--peek-hide, 0px));
      z-index: 10;
      background: var(--bg);
    }
    footer.bounce { animation: peek 1.9s cubic-bezier(.3,.7,.4,1) .7s both; }
  }
  @keyframes peek {
    0%, 100% { transform: none; }
    18%, 48% { transform: translateY(calc(-1 * var(--peek-hide, 0px))); }
    72%      { transform: none; }
    84%      { transform: translateY(-10px); }
  }

  /* ---------- Phone (the QR code case) ---------- */
  @media (max-width: 720px) {

    main { padding-top: 20px; }
    .tabs {
      flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto;
      margin: 0 calc(-1 * clamp(16px, 4vw, 48px)) 16px; padding: 0 clamp(16px, 4vw, 48px);
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .stage { height: calc(var(--slide-w) * 0.8); }
    .arrow { width: 36px; height: 52px; }
    .arrow.prev { left: 6px; }
    .arrow.next { right: 6px; }
    .desc { width: 100%; }
    footer { grid-template-columns: 1fr auto; row-gap: 20px; }
    .resume-box { grid-column: 1 / -1; grid-row: 1; }
    .resume { display: block; width: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .slide, .desc.swap > *, footer.bounce { transition: none; animation: none; }
  }
</style>

    link: null, tint: "#6b5a2a", media: { type: "image", src: "/media/awards.jpg", position: "center 20%" }
  }
];

const FUTURE = [
  { title: "Realtor Hub", body: "A single dashboard for a real estate agent: listings, a client tracker, and AI agents that draft emails and social posts." },
  { title: "KW Digital Office", body: "A multi-agent AI layer that runs across school, training, and business." },
  { title: "Project Jarvis", body: "A custom AI system with six specialized agents that handle research, writing, scheduling, strategy, compliance, and management across every area of my life, all tied together by a manager agent who compiles a daily briefing. The end goal is a physical wall-mounted device with a wake word, speaker, and pico projector that serves as the voice and face of the whole system, turning it into a real-life Jarvis from Iron Man." }
];
/* ========================================================= */

const $ = id => document.getElementById(id);
const stage = $("stage"), desc = $("desc"), tabs = $("tabs");
let current = 0;

// contact + links
$("phone").href = "tel:" + PROFILE.phone.replace(/\D/g, "");
$("phone").querySelector(".full").textContent = PROFILE.phone;
$("email").href = "mailto:" + PROFILE.email;
$("email").querySelector(".full").textContent = PROFILE.email;
$("github").href = PROFILE.github;
$("linkedin").href = PROFILE.linkedin;
$("resume").href = PROFILE.resume;
$("download").href = PROFILE.resume;

// section tabs, in order of first appearance
const sections = [...new Set(SLIDES.map(s => s.section))];
const tabEls = sections.map(name => {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = name;
  b.onclick = () => go(SLIDES.findIndex(s => s.section === name));
  tabs.appendChild(b);
  return b;
});

// build slides
let swiped = false;
const els = SLIDES.map((s, i) => {
  const el = document.createElement("div");
  el.className = "slide";
  el.setAttribute("role", "group");
  el.setAttribute("aria-label", `${i + 1} of ${SLIDES.length}: ${s.title}`);
  if (s.media && s.media.type === "video") {
    el.innerHTML = `<video src="${s.media.src}" muted loop playsinline preload="metadata" style="object-position:${s.media.position || "center"}"></video>`;
  } else if (s.media && s.media.type === "image") {
    el.innerHTML = s.media.fit === "contain"
      ? `<img class="fill" src="${s.media.src}" alt="" aria-hidden="true"><img class="whole" src="${s.media.src}" alt="${s.title}" loading="lazy">`
      : `<img src="${s.media.src}" alt="${s.title}" loading="lazy" style="object-position:${s.media.position || "center"}">`;
  } else {
    el.innerHTML = `<div class="ph" style="--tint:${s.tint}"><i>${s.section}</i><b>${s.title}</b></div>`;
  }
  el.addEventListener("click", () => { if (!swiped && i !== current) go(i); });
  stage.appendChild(el);
  return el;
});

function offsetOf(i) {
  const n = SLIDES.length;
  let d = (i - current) % n;
  if (d > n / 2) d -= n;
  if (d < -n / 2) d += n;
  return d;
}

function layout() {
  const w = els[0].offsetWidth;
  const gap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--gap"));
  els.forEach((el, i) => {
    const d = offsetOf(i);
    const far = Math.abs(d) > 1;
    el.style.transform = `translateX(${d * (w * 0.86 + gap)}px) scale(${d === 0 ? 1 : 0.82})`;
    el.style.opacity = d === 0 ? 1 : far ? 0 : 0.38;
    el.style.filter = d === 0 ? "none" : "grayscale(.6)";
    el.style.zIndex = 3 - Math.abs(d);
    el.style.pointerEvents = far ? "none" : "auto";
    el.classList.toggle("is-current", d === 0);
    el.setAttribute("aria-hidden", d !== 0);
    const v = el.querySelector("video");
    if (v) d === 0 ? v.play().catch(() => {}) : v.pause();
  });
}

function renderTabs() {
  const active = SLIDES[current].section;
  tabEls.forEach((b, i) => {
    const on = sections[i] === active;
    b.setAttribute("aria-current", on);
    if (on && tabs.scrollWidth > tabs.clientWidth) {
      tabs.scrollTo({ left: b.offsetLeft - tabs.clientWidth / 2 + b.offsetWidth / 2, behavior: "smooth" });
    }
  });
}

function renderDesc() {
  const s = SLIDES[current];
  desc.classList.remove("swap"); void desc.offsetWidth; desc.classList.add("swap");
  desc.innerHTML = `
    <div class="desc-top"><h2>${s.title}</h2><span class="count">${current + 1} / ${SLIDES.length}</span></div>
    <div class="role">${s.role}</div>
    ${s.body ? `<p class="body">${s.body}</p>` : ""}
    ${s.points && s.points.length ? `<ul>${s.points.map(p => `<li>${p}</li>`).join("")}</ul>` : ""}
    ${s.link ? `<a class="more" href="${s.link.href}" target="_blank" rel="noopener">${s.link.label} ↗</a>` : ""}`;
}

function go(i) {
  current = (i + SLIDES.length) % SLIDES.length;
  layout(); renderTabs(); renderDesc();
}

$("prev").onclick = () => go(current - 1);
$("next").onclick = () => go(current + 1);
document.addEventListener("keydown", e => {
  if ($("future").open) return;
  if (e.key === "ArrowLeft") go(current - 1);
  if (e.key === "ArrowRight") go(current + 1);
});

// swipe
let startX = null;
stage.addEventListener("pointerdown", e => { startX = e.clientX; swiped = false; });
stage.addEventListener("pointerup", e => {
  if (startX === null) return;
  const dx = e.clientX - startX; startX = null;
  if (Math.abs(dx) > 45) { swiped = true; go(current + (dx < 0 ? 1 : -1)); }
});
stage.addEventListener("pointercancel", () => { startX = null; });

// future projects sheet
$("futureList").innerHTML = FUTURE.map(f => `<li><b>${f.title}</b><span>${f.body}</span></li>`).join("");
$("futureBtn").onclick = () => $("future").showModal();
$("closeFuture").onclick = () => $("future").close();
$("future").addEventListener("click", e => { if (e.target === $("future")) $("future").close(); });

// desktop: tuck the footer below the screen edge so just the top of the resume button shows
const footer = document.querySelector("footer");
const TIP = 44; // px of the footer left visible
function peek() {
  const desktop = matchMedia("(min-width: 721px)").matches;
  footer.style.setProperty("--peek-hide", desktop ? Math.max(0, footer.offsetHeight - TIP) + "px" : "0px");
}
peek();
if (footer.getBoundingClientRect().bottom > innerHeight + 1 && matchMedia("(min-width: 721px)").matches) {
  footer.classList.add("bounce");
  footer.addEventListener("animationend", () => footer.classList.remove("bounce"), { once: true });
}

window.addEventListener("resize", () => { layout(); peek(); });
go(0);
</script>
</body>
</html>
